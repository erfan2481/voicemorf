name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install JS dependencies
        run: npm install

      - name: Generate fresh Android project via Capacitor
        run: |
          rm -rf android
          npx cap add android

      - name: Generate app icons
        run: npx @capacitor/assets generate --android

      - name: Apply Tapsell ad SDK patches
        run: python3 android-patches/apply_patches.py

      - name: Copy web assets into the Android project
        run: npx cap copy android

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Debug list Tapsell SDK classes
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath > /tmp/deps.txt 2>&1 || true
          echo "----- Tapsell lines in dependency tree -----"
          grep -i tapsell /tmp/deps.txt || echo "(nothing found, dumping full output below)"
          echo "----- Full dependency output (last 150 lines) -----"
          tail -n 150 /tmp/deps.txt
          echo "----- Searching for Banner class inside the AAR -----"
          find ~/.gradle/caches -iname "*tapsell-plus-sdk-android*.aar" | while read -r f; do
            echo "Found AAR: $f"
            mkdir -p /tmp/tp && rm -rf /tmp/tp/* && cd /tmp/tp
            unzip -o "$f" -d aar > /dev/null
            find aar -iname "*.jar" | while read -r j; do
              unzip -l "$j" | grep -i banner || echo "(no Banner class in $j)"
            done
          done

      - name: Build unsigned release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign release APK
        uses: r0adkll/sign-android-release@v1
        id: sign_apk
        with:
          releaseDirectory: android/app/build/outputs/apk/release
          signingKey: signing/release.keystore
          alias: ${{ secrets.KEY_ALIAS }}
          keyStorePassword: ${{ secrets.KEYSTORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"
          
      - name: Upload signed APK
        uses: actions/upload-artifact@v4
        with:
          name: voicemorph-release-apk
          path: ${{ steps.sign_apk.outputs.signedReleaseFile }}
